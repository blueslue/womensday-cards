<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>🌸铁三班女神节专属贺卡🌸</title>

  <!-- Open Graph / 微信分享卡片 -->
  <meta property="og:type"        content="website" />
  <meta property="og:url"         content="https://38.daliok.cn/" />
  <meta property="og:title"       content="🌸铁三班女神节专属贺卡🌸" />
  <meta property="og:description" content="请选择你的名字领取专属祝福" />
  <meta property="og:image"       content="https://38.daliok.cn/assets/og-cover.jpg" />
  <meta property="og:image:width"  content="1200" />
  <meta property="og:image:height" content="630" />
  <meta property="og:locale"      content="zh_CN" />

  <!-- 微信专用 -->
  <meta name="twitter:card"        content="summary_large_image" />
  <meta name="twitter:title"       content="🌸铁三班女神节专属贺卡🌸" />
  <meta name="twitter:description" content="请选择你的名字领取专属祝福" />
  <meta name="twitter:image"       content="https://38.daliok.cn/assets/og-cover.jpg" />
  <style>
    :root{
      --bg1:#0b0b12;
      --bg2:#151526;
      --card:rgba(255,255,255,.08);
      --card2:rgba(255,255,255,.06);
      --stroke:rgba(255,255,255,.14);
      --text:rgba(255,255,255,.92);
      --muted:rgba(255,255,255,.68);
      --muted2:rgba(255,255,255,.52);
      --danger:#ff4d6d;
    }
    *{box-sizing:border-box}
    body{
      margin:0;
      min-height:100vh;
      font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial;
      color:var(--text);
      background:
        radial-gradient(1200px 700px at 15% 15%, rgba(120,119,198,.28), transparent 55%),
        radial-gradient(900px 600px at 85% 30%, rgba(236,72,153,.22), transparent 55%),
        radial-gradient(900px 700px at 40% 95%, rgba(34,197,94,.12), transparent 55%),
        linear-gradient(180deg, var(--bg1), var(--bg2));
      display:flex;
      align-items:center;
      justify-content:center;
      padding:24px 14px;
    }
    .wrap{width:min(920px, 100%);}
    .top{
      display:flex;
      align-items:flex-start;
      justify-content:space-between;
      gap:18px;
      margin-bottom:16px;
    }
    .brand{
      display:flex;
      flex-direction:column;
      gap:8px;
    }
    .kicker{
      display:inline-flex;
      gap:8px;
      align-items:center;
      font-size:13px;
      color:var(--muted);
      letter-spacing:.2px;
    }
    .dot{
      width:8px;height:8px;border-radius:999px;background:rgba(255,255,255,.35);
      box-shadow:0 0 0 4px rgba(255,255,255,.06);
    }
    h1{
      margin:0;
      font-size:28px;
      line-height:1.15;
      letter-spacing:.2px;
    }
    .sub{
      margin:0;
      color:var(--muted);
      line-height:1.55;
      font-size:14px;
      max-width:62ch;
    }
    .panel{
      border:1px solid var(--stroke);
      background:linear-gradient(180deg, var(--card), var(--card2));
      border-radius:18px;
      padding:18px;
      backdrop-filter: blur(12px);
      box-shadow:
        0 24px 60px rgba(0,0,0,.45),
        inset 0 1px 0 rgba(255,255,255,.10);
    }
    .grid{
      display:grid;
      grid-template-columns: 1.1fr .9fr;
      gap:14px;
      align-items:end;
    }
    @media (max-width:720px){
      .top{flex-direction:column;}
      .grid{grid-template-columns:1fr;}
    }
    label{
      display:block;
      font-size:13px;
      color:var(--muted);
      margin-bottom:8px;
    }
    .input{
      width:100%;
      border:1px solid rgba(255,255,255,.18);
      background:rgba(0,0,0,.22);
      color:var(--text);
      border-radius:14px;
      padding:13px 14px;
      font-size:16px;
      outline:none;
      transition:.18s border-color, .18s box-shadow;
    }
    .input:focus{
      border-color: rgba(255,255,255,.32);
      box-shadow: 0 0 0 4px rgba(120,119,198,.18);
    }
    .actions{
      display:flex;
      gap:10px;
      justify-content:flex-end;
      flex-wrap:wrap;
      margin-top:14px;
    }
    .btn{
      border:1px solid rgba(255,255,255,.18);
      background:rgba(255,255,255,.10);
      color:var(--text);
      border-radius:14px;
      padding:12px 14px;
      font-size:15px;
      cursor:pointer;
      transition:.16s transform, .16s background, .16s border-color;
      user-select:none;
    }
    .btn:hover{background:rgba(255,255,255,.14); border-color:rgba(255,255,255,.26);}
    .btn:active{transform:translateY(1px);}
    .btnPrimary{
      border-color:rgba(255,255,255,.22);
      background:linear-gradient(135deg, rgba(120,119,198,.55), rgba(236,72,153,.35));
      box-shadow: 0 10px 30px rgba(236,72,153,.10);
    }
    .btnPrimary:hover{background:linear-gradient(135deg, rgba(120,119,198,.68), rgba(236,72,153,.42));}
    .hintRow{
      display:flex;
      gap:10px;
      justify-content:space-between;
      align-items:flex-start;
      margin-top:12px;
      flex-wrap:wrap;
    }
    .hint{
      font-size:13px;
      color:var(--muted2);
      line-height:1.6;
    }
    .msg{
      margin-top:10px;
      font-size:13px;
      color:var(--danger);
      min-height:18px;
    }
    .pill{
      display:inline-flex;
      gap:8px;
      align-items:center;
      padding:8px 10px;
      border-radius:999px;
      border:1px solid rgba(255,255,255,.16);
      background:rgba(255,255,255,.06);
      color:var(--muted);
      font-size:12px;
      white-space:nowrap;
    }
    .kbd{
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace;
      border:1px solid rgba(255,255,255,.18);
      background:rgba(0,0,0,.18);
      padding:2px 6px;
      border-radius:8px;
      color:rgba(255,255,255,.85);
    }
    .foot{
      margin-top:14px;
      display:flex;
      justify-content:space-between;
      gap:10px;
      flex-wrap:wrap;
      color:rgba(255,255,255,.35);
      font-size:12px;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="top">
      <div class="brand">
        <div class="kicker"><span class="dot"></span>Personal Greeting Cards</div>
        <h1>嗨，输入你的名字，领取专属女神节祝福 💐</h1>
        <p class="sub">输入 1–2 个字会出现下拉提示，直接点选最省事。</p>
      </div>
      <div class="pill">快捷键：<span class="kbd">Enter</span> 解锁</div>
    </div>

    <div class="panel">
      <div class="grid">
        <div>
          <label for="name">名字（建议从下拉选择）</label>
          <input class="input" id="name" list="names" placeholder="例如：陈莹倩 / 李菁 / 余平" autocomplete="off" />
          <datalist id="names"></datalist>
          <div class="msg" id="msg" aria-live="polite"></div>
        </div>
        <div>
          <label>操作</label>
          <div class="actions">
            <button class="btn btnPrimary" id="unlockBtn">解锁贺卡</button>
            <button class="btn" id="clearBtn">清空</button>
          </div>
        </div>
      </div>

      <div class="hintRow">
        <div class="hint">找不到名字时别急：可能是多了空格，或输入了同音字。建议从下拉里直接点选。</div>
  
      </div>

      <div class="foot">
        <div>© Greeting Cards</div>
        <div id="count"></div>
      </div>
    </div>
  </div>

  <script>
    // 名字 => slug（拼音小写）
    const DB = {
      "陈莹倩": { slug: "chenyingqian" },
      "段桃": { slug: "duantao" },
      "廉花": { slug: "lianhua" }, 
      "黄红英": { slug: "huanghongying" },
      "刘思婷": { slug: "liusiting" },
      "刘莹": { slug: "liuying" },
      "李菁": { slug: "lijing" },
      "邱越": { slug: "qiuyue" },
      "钱素娟": { slug: "qiansujuan" },
      "阮瑜": { slug: "ruanyu" },
      "孙贇": { slug: "sunyun" },
      "汤琰": { slug: "tangyan" },
      "王振华": { slug: "wangzhenhua" },
      "魏银珍": { slug: "weiyinzhen" },
      "吴玲": { slug: "wuling" },
      "余平": { slug: "yuping" },
      "于阳": { slug: "yuyang" },
      "王英如": { slug: "wangyingru" },
      "杨静": { slug: "yangjing" },
      "赵琳": { slug: "zhaolin" },
      "张睿": { slug: "zhangrui" },
    };

    // 可选：别名（空格变体等）
    const ALIASES = {
      "余 平": "余平",
      "王 振 华": "王振华"
    };

    const elName = document.getElementById("name");
    const elMsg = document.getElementById("msg");
    const elList = document.getElementById("names");
    const elCount = document.getElementById("count");

    // 填充 datalist
    const names = Object.keys(DB).sort((a,b)=>a.localeCompare(b,'zh-CN'));
    elList.innerHTML = names.map(n => `<option value="${n}"></option>`).join("");
    elCount.textContent = `已配置 ${names.length} 张贺卡`;

    function normalize(s){
      return (s || "").replace(/\u3000/g,' ').trim();
    }

    function unlock(){
      elMsg.textContent = "";
      let name = normalize(elName.value);
      if (!name){
        elMsg.textContent = "请输入名字，或从下拉列表选择。";
        return;
      }

      if (ALIASES[name]) name = ALIASES[name];

      const rec = DB[name];
      if (!rec){
        const hint = names.find(n => n.includes(name) || name.includes(n));
        elMsg.textContent = hint
          ? `没有找到「${name}」。你是不是想选「${hint}」？（建议从下拉直接点选）`
          : `没有找到「${name}」。请检查是否输入正确（同音字/空格）。`;
        return;
      }

      // 传 slug + name 给贺卡页
      window.location.href = `card.html?who=${encodeURIComponent(rec.slug)}&name=${encodeURIComponent(name)}`;
    }

    document.getElementById("unlockBtn").addEventListener("click", unlock);
    document.getElementById("clearBtn").addEventListener("click", () => {
      elName.value = "";
      elMsg.textContent = "";
      elName.focus();
    });

    elName.addEventListener("keydown", (e) => {
      if (e.key === "Enter") unlock();
    });
  </script>
</body>
</html>
