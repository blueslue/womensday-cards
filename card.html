<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>生日快乐</title>
  <style>
    :root{
      --bg:#07070c;
      --panel:rgba(255,255,255,.08);
      --stroke:rgba(255,255,255,.14);
      --text:rgba(255,255,255,.92);
      --muted:rgba(255,255,255,.65);
    }
    *{box-sizing:border-box}
    body{
      margin:0;
      min-height:100vh;
      background:
        radial-gradient(900px 600px at 10% 15%, rgba(120,119,198,.22), transparent 55%),
        radial-gradient(800px 560px at 90% 30%, rgba(236,72,153,.18), transparent 55%),
        linear-gradient(180deg, var(--bg), #101023);
      color:var(--text);
      font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial;
      display:flex;
      justify-content:center;
      padding:18px 14px 28px;
    }
    .wrap{width:min(980px, 100%);}
    .header{
      display:flex;
      align-items:flex-end;
      justify-content:space-between;
      gap:12px;
      margin-bottom:14px;
      flex-wrap:wrap;
    }
    .title{
      margin:0;
      font-size:20px;
      letter-spacing:.2px;
    }
    .sub{
      margin:6px 0 0;
      color:var(--muted);
      font-size:13px;
      line-height:1.6;
    }
    .controls{
      display:flex;
      gap:10px;
      flex-wrap:wrap;
      justify-content:flex-end;
    }
    .btn{
      border:1px solid rgba(255,255,255,.18);
      background:rgba(255,255,255,.10);
      color:var(--text);
      border-radius:14px;
      padding:10px 12px;
      font-size:14px;
      cursor:pointer;
      transition:.16s transform, .16s background, .16s border-color;
      user-select:none;
    }
    .btn:hover{background:rgba(255,255,255,.14); border-color:rgba(255,255,255,.26);}
    .btn:active{transform:translateY(1px);}
    .frame{
      border:1px solid var(--stroke);
      background:linear-gradient(180deg, rgba(255,255,255,.08), rgba(255,255,255,.05));
      border-radius:18px;
      overflow:hidden;
      box-shadow: 0 24px 70px rgba(0,0,0,.55), inset 0 1px 0 rgba(255,255,255,.10);
    }
    .img{
      width:100%;
      display:block;
      height:auto;
      transform: translateZ(0);
      animation: floatIn .45s ease-out both;
    }
    @keyframes floatIn{
      from{opacity:0; transform: translateY(10px) scale(.995);}
      to{opacity:1; transform: translateY(0) scale(1);}
    }
    .overlay{
      position:relative;
    }
    .badge{
      position:absolute;
      left:12px;
      bottom:12px;
      padding:10px 12px;
      border-radius:14px;
      border:1px solid rgba(255,255,255,.16);
      background:rgba(0,0,0,.35);
      backdrop-filter: blur(10px);
      font-size:13px;
      color:rgba(255,255,255,.9);
      max-width: calc(100% - 24px);
      overflow:hidden;
      text-overflow:ellipsis;
      white-space:nowrap;
    }
    .tip{
      margin-top:12px;
      color:rgba(255,255,255,.55);
      font-size:12px;
      line-height:1.6;
    }
    a{color:rgba(255,255,255,.78); text-decoration:none; border-bottom:1px dashed rgba(255,255,255,.25);}
  </style>
</head>
<body>
  <div class="wrap">
    <div class="header">
      <div>
        <h2 class="title" id="ttl">生日快乐 🎉</h2>
        <p class="sub">如未自动播放音乐，请点「播放音乐」（浏览器限制属于正常现象）。</p>
      </div>
      <div class="controls">
        <button class="btn" onclick="play()">播放音乐</button>
        <button class="btn" onclick="pause()">暂停</button>
        <button class="btn" onclick="back()">返回解锁页</button>
      </div>
    </div>

    <div class="frame overlay">
      <img id="cardImg" class="img" alt="Greeting Card" />
      <div class="badge" id="badge"></div>
    </div>

    <div class="tip">图片路径：<code>cards/&lt;slug&gt;.jpg</code> ｜ 音乐路径：<code>assets/bgm.mp3</code></div>

    <audio id="bgm" src="assets/bgm.mp3" loop preload="auto"></audio>
  </div>

  <script>
    function param(key){
      const u = new URL(window.location.href);
      return u.searchParams.get(key) || "";
    }

    const slug = param("who");
    const name = param("name");

    const img = document.getElementById("cardImg");
    const badge = document.getElementById("badge");
    const ttl = document.getElementById("ttl");
    const audio = document.getElementById("bgm");

    if (name){
      ttl.textContent = `${decodeURIComponent(name)}，生日快乐 🎉`;
      badge.textContent = `To: ${decodeURIComponent(name)}`;
    } else {
      badge.textContent = "祝你生日快乐 🎉";
    }

    img.src = `cards/${decodeURIComponent(slug)}.jpg`;

    // 图片加载失败提示
    img.addEventListener("error", () => {
      badge.textContent = "图片未找到：请检查 cards/ 下文件名是否与 slug 完全一致（含大小写与后缀）";
    });

    function play(){ audio.play().catch(()=>{}); }
    function pause(){ audio.pause(); }
    function back(){ window.location.href = "index.html"; }

    // 尝试自动播放（可能被拦截，用户点击播放按钮即可）
    window.addEventListener("load", () => {
      audio.play().catch(()=>{});
    });
  </script>
</body>
</html>
